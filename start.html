<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App | Start page</title>
</head>
<body>
    <h2> Choose Quiz:</h2>
    <form action="/" method ="post">
        <select name="quiz">
            {% for id, name in q_list %}
                <option value="{{id}}">{{name}}</option>
            {% endfor%}
        </select>
        <p><input type="submit" value="Choose"></p>
    </form>
    
        

</body>
</html>
